---
# GitHub Actions workflow for running integration tests
name: Run Integration Tests
# Trigger workflow on push and pull requests to main and feature/github-actions branches
on:
  push:
    branches: [main, feature/github-actions]
  pull_request:
    branches: [main, feature/github-actions]
jobs:
  # Main job for running integration tests
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out repository code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Setup Docker BuildX for improved build capabilities
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Step 3: Execute integration tests in parallel
      - name: Run Integration Tests
        run: |-
          # Pull the bash image in background and wait for completion
          docker pull bash:latest &
          wait

          # Array to store failed test paths
          failed_tests=()

          # Launch each test script in a separate container in parallel
          for test_script in integration_tests/*.sh; do
            docker run --rm -v "$(pwd):/workspace" -w /workspace bash:latest bash "$test_script" &
            pids[$!]="$test_script"
          done

          # Monitor test execution and collect failures
          for pid in "${!pids[@]}"; do
            if ! wait "$pid"; then
              failed_tests+=("${pids[$pid]}")
            fi
          done

          # Exit with failure if any tests failed
          if [ ${#failed_tests[@]} -ne 0 ]; then
            echo "Failed tests: ${failed_tests[*]}"
            exit 1
          fi
